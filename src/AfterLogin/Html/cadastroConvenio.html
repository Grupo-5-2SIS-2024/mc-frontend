<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/remixicon@3.2.0/fonts/remixicon.css'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../Css/cadastroConvenio.css">
    <link rel="stylesheet" href="../Css/Sidebar.css">
    <link rel="shortcut icon" href="../../Assets/logo_Multclinics_branca_sem_nome.png" type="image/x-icon">
    <title>Multiclinics | Cadastro de Convênio</title>
</head>

<body>
    <i id="hamburger-menu" class="fa-solid fa-bars"></i>

    <div id="menu-overlay" class="menu-overlay">
        <ul>
            <li><a href="homePosLoginMedico.html">Home</a></li>
            <li><a href="calendario.html">Agendamento</a></li>
            <li><a href="listagemColaborador.html">Colaborador</a></li>
            <li><a href="listagemPaciente.html">Paciente</a></li>
            <li><a href="dashboards.html">Dashboards</a></li>
            <li><a href="listagemLead.html">Leads</a></li>
            <li id="menuConveniosOverlay" style="display: none;"><a href="listagemConvenio.html">Convênios</a></li>
        </ul>
    </div>
    <nav id="sidebar">
        <div id="sidebar_content">
            <div id="user">
                <img src="../Assets/perfil.jpeg" id="user_avatar" alt="Avatar">

                <p id="user_infos">
                    <span id="user_nome" class="item-description">Silvia</span>
                    <span id="user_permissao" class="item-description">ADM</span>
                </p>
            </div>

            <ul id="side_items">
                <li class="side-item">
                    <a href="homePosLoginMedico.html">
                        <i class="fa-solid fa-home"></i>
                        <span class="item-description">
                            Home
                        </span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="calendario.html">
                        <i class="fa-solid fa-calendar"></i>
                        <span class="item-description">
                            Agendamento
                        </span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="listagemColaborador.html">
                        <i class="fa-solid fa-user"></i>
                        <span class="item-description">
                            Colaborador
                        </span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="listagemPaciente.html">
                        <i class="fa-solid fa-hospital-user"></i>
                        <span class="item-description">
                            Paciente
                        </span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="dashboards.html">
                        <i class="fa-solid fa-chart-line"></i>
                        <span class="item-description">
                            Dashboards
                        </span>
                    </a>
                </li>

                <li id="Lead" class="side-item">
                    <a href="listagemLead.html">
                        <i class="fa-solid fa-filter"></i>
                        <span class="item-description">
                            Leads
                        </span>
                    </a>
                </li>

                <li id="menuConvenios" class="side-item active" style="display: none;">
                    <a href="listagemConvenio.html">
                        <i class="fa-solid fa-notes-medical"></i>
                        <span class="item-description">
                            Convênios
                        </span>
                    </a>
                </li>
            </ul>

            <button id="open_btn">
                <i id="open_btn_icon" class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div id="logout">
            <button onclick="deslogar()" id="logout_btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="item-description">
                    Logout
                </span>
            </button>
        </div>
    </nav>

    <main>
        <div class="ContainerCadastro">
            <h1>Cadastre um <span class="convenio-title">Convênio</span></h1><br><br>

            <div class="inputs_Container">
                <div class="inputs_section">
                    <div class="input">
                        <input class="input__field" id="nomeConvenio" type="text" required />
                        <label for="nomeConvenio" class="input__label">Nome do Convênio</label>
                        <small class="error" id="error-nomeConvenio"></small>
                    </div>

                    <div class="input">
                        <textarea class="input__field textarea" id="descricaoConvenio" rows="3" required></textarea>
                        <label for="descricaoConvenio" class="input__label">Descrição</label>
                        <small class="error" id="error-descricaoConvenio"></small>
                    </div>
                </div>
            </div>

            <div class="section-planos">
                <h2>Planos do Convênio</h2>
                <div id="listaPlanos"></div>
                <button type="button" id="btnAddPlano" class="btn-add-plano">
                    <i class="fa-solid fa-plus"></i> Adicionar Plano
                </button>
            </div>

            <div class="btn-area">
                <button type="button" class="btn-voltar" onclick="window.location.href='listagemConvenio.html'">
                    <i class="fa-solid fa-arrow-left"></i> Voltar
                </button>
                <button type="button" class="registrar" onclick="cadastrarConvenio()">
                    <i class="fa-solid fa-check"></i> Cadastrar
                </button>
            </div>
        </div>
    </main>

    <script src="../Js/cadastroConvenio.js"></script>
    <script src="../Js/funcoesPadroes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../Js/sessao.js"></script>
</body>

</html>
